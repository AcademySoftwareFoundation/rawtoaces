name: CI Steps

on:
  workflow_call:
    # This inputs receive values via the "with:" section in ci_workflow.yml
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
      container:
        type: string
      container_volumes:
        type: string
        default: '[]'
      cc_compiler:
        type: string
      cxx_compiler:
        type: string
      cxx_standard:
        type: number
        default: 17
      build_type:
        type: string
        default: 'Release'
      install_deps:
        type: string
        default: 'install_deps_yum'
      toolchain_file:
        type: string
      build_shared_libs:
        type: string
        default: 'ON'
      enable_lensfun:
        type: string
        default: 'ON'
      enable_eigen:
        type: string
        default: 'ON'
      vfxyear:
        type: number
        default: 0
      ceres_hack:
        type: string
        default: 'OFF'
      test_install:
        type: string
        default: 'ON'
      sanitiser_mode:
        type: string
        default: 'none'
      workflow_name:
        type: string
        default: 'CI Steps'
      

permissions: read-all

jobs:
  build_steps:
    name: ${{ inputs.workflow_name }}
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container }}
      volumes: ${{ fromJson( inputs.container_volumes ) }}

    env:
      CXX: ${{inputs.cxx_compiler}}
      CC: ${{inputs.cc_compiler}}

    steps:
          
      - name: Install nodejs20glibc2.17 - VFX2022 only
        if: inputs.vfxyear == 2022
        run: |
          curl --silent https://unofficial-builds.nodejs.org/download/release/v20.18.1/node-v20.18.1-linux-x64-glibc-217.tar.xz | tar -xJ --strip-components 1 -C /node20217 -f -
          
      - name: "Checkout"
        if: inputs.vfxyear != 2022
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: '0'

      - name: "Checkout (VFX 2022)"
        if: inputs.vfxyear == 2022
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: '0'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Yum config - VFX2022 only
        if: inputs.vfxyear == 2022
        shell: bash
        run: |
          yum-config-manager --disable centos-sclo-rh || true
          sed -i 's,^mirrorlist=,#,; s,^#baseurl=http://mirror\.centos\.org/centos/$releasever,baseurl=https://vault.centos.org/7.9.2009,' /etc/yum.repos.d/CentOS-Base.repo
          
      - name: Cache vcpkg binary cache
        if: inputs.runner == 'windows-latest'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: C:/vcpkg/binary-cache
          key: |
            vcpkg-binary-cache-${{ runner.os }}-${{ hashFiles('build_scripts/vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-cache-${{ runner.os }}-
            
      - name: Dependencies
        if: inputs.vfxyear < 2024
        shell: bash
        run: |
          bash build_scripts/${{ inputs.install_deps }}.bash

      - name: Dependencies (aswf/ci-rawtoaces)
        if: inputs.vfxyear > 2023
        shell: bash
        run: |
          conan profile detect --force
          conan install --requires=tsl-robin-map/1.4.0 --generator CMakeDeps --generator CMakeToolchain --output-folder=build_deps --build=missing --settings compiler.cppstd=gnu17
          python -m pip install pytest
          sudo yum install --setopt=tsflags=nodocs -y perl-Image-ExifTool
    
      - name: Configure CMake
        run: >
          cmake 
          -B build 
          -S .
          -D RTA_CENTOS7_CERES_HACK=${{ inputs.ceres_hack }}
          -D CMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -D CMAKE_CXX_STANDARD=${{ inputs.cxx_standard }}
          -D CMAKE_TOOLCHAIN_FILE="${{ inputs.toolchain_file }}"
          -D CMAKE_BUILD_TYPE="${{ inputs.build_type }}"
          -D ENABLE_SHARED="${{ inputs.build_shared_libs }}"
          -D RTA_ENABLE_LENSFUN="${{ inputs.enable_lensfun }}"
          -D RTA_ENABLE_EIGEN="${{ inputs.enable_eigen }}"
          -D RTA_SANITISER_MODE="${{ inputs.sanitiser_mode }}"
          
      - name: Build
        # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        run: |
          cmake --build build --config ${{ inputs.build_type }}
          
      - name: Test
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        if: inputs.sanitiser_mode == 'none'
        working-directory: build
        run: >
          ctest
          --build-config ${{ inputs.build_type }}
          --rerun-failed
          --output-on-failure

      - name: Install
        if: inputs.test_install == 'ON'
        run: >
          cmake --install build
      
      - name: Configure config_tests
        if: inputs.test_install == 'ON'
        run: >
          cmake
          -B build_config_test
          -S ./tests/config_tests
          -D RAWTOACES_DIR=${{ github.workspace }}/install/lib/cmake/RAWTOACES
          -D CMAKE_TOOLCHAIN_FILE="${{ inputs.toolchain_file }}"
          -D CMAKE_CXX_STANDARD=${{ inputs.cxx_standard }}
          -D CMAKE_BUILD_TYPE=${{ inputs.build_type }}

      - name: Build config_tests
        if: inputs.test_install == 'ON'
        run: >
          cmake --build build_config_test --config ${{ inputs.build_type }}
          
      - name: Test config_tests
        if: inputs.test_install == 'ON'
        run: >
          ctest
          --build-config ${{ inputs.build_type }}
          --rerun-failed 
          --output-on-failure 
          --test-dir build_config_test

      - name: Run sanitiser checks
        if: inputs.sanitiser_mode != 'none'
        working-directory: build/src/rawtoaces
        run: |
          bash ../../../tests/run_valid.sh
