# Documentation build and deployment workflow
# Builds documentation using Doxygen + Sphinx + Breathe
# Deploys to GitHub Pages on pushes to main branch

name: Documentation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'include/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'include/**'
      - '.github/workflows/docs.yml'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/docs/requirements.txt

      - name: Build Doxygen XML
        working-directory: src/docs
        run: doxygen Doxyfile

      - name: Build Sphinx HTML
        working-directory: src/docs
        run: |
          sphinx-build -b html -D breathe_projects.rawtoaces=doxygen/xml . _build/html

      - name: Upload artifact for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: src/docs/_build/html

      - name: Upload artifact for manual builds
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          path: src/docs/_build/html
          name: rawtoaces-documentation
          retention-days: 5
    

  deploy-docs:
    # Only deploy on push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
