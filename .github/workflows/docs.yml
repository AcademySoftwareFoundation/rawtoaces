# Documentation build and deployment workflow
# Builds and checks the files from this run. Publishes the default branch and
# release docs after a push to main or a release tag.

name: Documentation

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
    paths:
      - 'src/docs/**'
      - 'include/**'
      - 'src/bindings/**'
      - 'src/rawtoaces_core/**'
      - 'src/rawtoaces_util/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'CMakeLists.txt'
      - 'configure.cmake'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
      - 'build_scripts/**'
      - 'tests/docs/**'
  pull_request:
    paths:
      - 'src/docs/**'
      - 'include/**'
      - 'src/bindings/**'
      - 'src/rawtoaces_core/**'
      - 'src/rawtoaces_util/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'CMakeLists.txt'
      - 'configure.cmake'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
      - 'build_scripts/**'
      - 'tests/docs/**'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: "docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}"
  cancel-in-progress: true

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/docs/requirements.txt

      - name: Test documentation validation
        run: python -m unittest discover -s tests/docs

      - name: Build and validate the proposed documentation
        run: python build_scripts/build_docs.py --repo-root . --output-dir site-preview

      - name: Upload pull-request preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          path: site-preview
          name: rawtoaces-documentation-preview
          retention-days: 5

  build-docs:
    if: github.event_name != 'pull_request'
    needs: validate-docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout publication sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          # A tag event validates the tag above, but latest remains main.
          ref: ${{ github.ref_type == 'tag' && 'main' || github.sha }}

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/docs/requirements.txt

      - name: Build versioned publication site
        run: |
          python build_scripts/build_versioned_docs.py --repo-root . --output-dir site --default-ref HEAD

      - name: Upload artifact for GitHub Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

      - name: Upload artifact for manual builds
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          path: site
          name: rawtoaces-documentation
          retention-days: 5
    

  deploy-docs:
    if: github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
